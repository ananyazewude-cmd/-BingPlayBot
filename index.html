<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beteseb Bingo Template</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(to bottom, #1c1d30, #0f101d); color: white; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .page { display: none; width: 100%; max-width: 450px; flex-direction: column; align-items: center; }
        .active { display: flex; }
        .stake-box { border: 2px solid #3d3420; background-color: #231942; border-radius: 12px; padding: 20px; width: 100%; box-sizing: border-box; margin-top: 20px; text-align: center; }
        .stake-title { color: #ffbe00; font-size: 14px; font-weight: bold; margin-bottom: 20px; }
        .stake-btn { width: 100%; border: none; padding: 14px 0; font-size: 16px; font-weight: bold; color: white; border-radius: 8px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-green { background: linear-gradient(to right, #00b894, #00cec9); }
        .btn-blue { background: linear-gradient(to right, #0984e3, #6c5ce7); }
        .stats-list { background-color: #1e163d; border-radius: 10px; width: 100%; padding: 15px; margin-top: 20px; box-sizing: border-box; }
        .stat-item { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
        .stat-num { font-size: 22px; font-weight: bold; color: white; }
        .stat-lbl { font-size: 12px; color: #a29bfe; margin-top: 2px; }
        .lobby-header { display: flex; width: 100%; justify-content: space-between; background-color: #1e1938; padding: 8px; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; font-size: 11px; }
        .lobby-timer { background-color: #ffbe00; color: #111; padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 13px; }
        .grid-96 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background-color: #1e1938; padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .g96-btn { background-color: #2d2554; color: white; border: none; padding: 10px 0; font-weight: bold; font-size: 12px; border-radius: 4px; }
        .g96-btn.taken { background-color: #e67e22; }
        .game-stats { display: flex; justify-content: space-around; width: 100%; background-color: #2e1d62; padding: 8px 4px; border-radius: 6px; margin-bottom: 12px; font-size: 11px; font-weight: bold; text-align: center; }
        .gstat-val { color: #ffbe00; font-size: 13px; margin-top: 2px; }
        .board-layout { display: flex; gap: 8px; width: 100%; }
        .board-left { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background-color: #272848; padding: 6px; border-radius: 8px; width: 45%; }
        .board-right { display: flex; flex-direction: column; width: 55%; gap: 8px; background-color: #232442; padding: 10px; border-radius: 8px; align-items: center; }
        .lnum-btn { background-color: #3d3e6a; color: #b3b5cb; border: none; font-size: 10px; font-weight: bold; padding: 6px 0; border-radius: 3px; text-align: center; }
        .lnum-btn.taken { background-color: #e67e22; color: white; }
        .ball-view { background-color: #ffbe00; color: #1c1d30; font-size: 24px; font-weight: bold; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .cartela-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; }
        .ccell { background-color: white; color: #1c1d30; font-size: 14px; font-weight: bold; padding: 8px 0; border-radius: 4px; text-align: center; }
        .ccell.star { background-color: #2ecc71 !important; color: #ffbe00; font-size: 16px; }
        .winner-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .winner-card { background-color: #232542; border-radius: 16px; width: 100%; max-width: 380px; padding: 20px; text-align: center; border: 1px solid #3d3e6a; }
        .crown-icon { font-size: 40px; color: #ffbe00; margin-bottom: 10px; }
        .win-title { font-size: 22px; font-weight: bold; color: #ffbe00; margin-bottom: 5px; }
        .win-subtitle { font-size: 14px; color: white; margin-bottom: 15px; }
        .win-users { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .win-user-tag { background-color: #3d3e6a; padding: 6px 12px; border-radius: 20px; font-size: 12px; }
        .bottom-bar { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
        .action-btn { flex: 1; border: none; padding: 12px 0; font-size: 14px; font-weight: bold; border-radius: 6px; color: white; cursor: pointer; }
        .btn-leave { background-color: #ff4757; }
        .btn-refresh { background-color: #e67e22; }
    </style>
</head>
<body>
    <div class="page active" id="pageStake">
        <h2 style="font-size:20px; margin-bottom:0;">Welcome to BingoX</h2>
        <div class="stake-box">
            <div class="stake-title">▷ Choose Your Stake</div>
            <button class="stake-btn btn-green" onclick="goToLobby(10)">▷ Play 10</button>
            <button class="stake-btn btn-blue" onclick="goToLobby(20)">▷ Play 20</button>
        </div>
        <div class="stats-list">
            <div class="stat-item"><div class="stat-num">400+</div><div class="stat-lbl">Active Players</div></div>
            <div class="stat-item"><div class="stat-num">60,000+</div><div class="stat-lbl">Games Played</div></div>
            <div class="stat-item"><div class="stat-num">500+</div><div class="stat-lbl">Winners Daily</div></div>
        </div>
    </div>
    <div class="page" id="pageLobby">
        <div class="lobby-header">
            <div>Main Wallet<br><strong style="color:#2ecc71;">200</strong></div>
            <div>Play Wallet<br><strong>0</strong></div>
            <div>Stake<br><strong id="lobbyStakeVal">10</strong></div>
            <div class="lobby-timer" id="lobbyTimer">46 s</div>
        </div>
        <div class="grid-96" id="grid96Container"></div>
        <div class="bottom-bar">
            <button class="action-btn btn-leave" onclick="location.reload()">Back</button>
            <button class="action-btn btn-refresh" onclick="goToGame()">Play Game</button>
        </div>
    </div>
    <div class="page" id="pageGame">
        <div class="game-stats">
            <div>Game ID<div class="gstat-val">BX-9972</div></div>
            <div>Players<div class="gstat-val">335</div></div>
            <div>Bet<div class="gstat-val" id="gameBetVal">10</div></div>
            <div>Derash<div class="gstat-val">2680</div></div>
            <div>Called<div class="gstat-val" id="gameCalledCount">0</div></div>
        </div>
        <div class="board-layout">
            <div class="board-left" id="gameLeftBoard"></div>
            <div class="board-right">
                <div class="ball-view" id="gameBallDisplay">--</div>
                <div style="font-size:11px; margin-bottom:5px;">Automatic <span style="color:#2ecc71;">● ON</span></div>
                <div class="cartela-grid" id="gameCartela"></div>
                <div style="font-size:10px; color:#ffbe00; margin-top:4px;">Cartela No: 131</div>
            </div>
        </div>
        <div class="bottom-bar">
            <button class="action-btn btn-leave" onclick="tg.close()">Leave</button>
            <button class="action-btn btn-refresh" onclick="startEngineDraw()">Start Draw</button>
        </div>
    </div>
    <div class="winner-overlay" id="pageWinner" style="display:none;">
        <div class="winner-card">
            <div class="crown-icon">👑</div>
            <div class="win-title">BINGO!</div>
            <div class="win-subtitle">2 players won!</div>
            <div class="win-users">
                <div class="win-user-tag">A Aziti #226</div>
                <div class="win-user-tag">T tare #220</div>
            </div>
            <button class="action-btn btn-refresh" style="margin-top:15px; width:100%;" onclick="location.reload()">Play Again</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
        function goToLobby(stake) {
            document.getElementById('lobbyStakeVal').innerText = stake;
            document.getElementById('gameBetVal').innerText = stake;
            const container = document.getElementById('grid96Container');
            container.innerHTML = '';
            for(let i=1; i<=96; i++) {
                const btn = document.createElement('button'); btn.className = 'g96-btn'; btn.innerText = i;
                if([3,9,14,22,45].includes(i)) btn.className += ' taken';
                container.appendChild(btn);
            }
            switchPage('pageLobby');
        }
        function goToGame() {
            const leftBoard = document.getElementById('gameLeftBoard'); leftBoard.innerHTML = '';
            for (let row = 0; row < 15; row++) {
                for (let col = 0; col < 5; col++) {
                    const num = col * 15 + (row + 1);
                    const btn = document.createElement('div'); btn.className = 'lnum-btn'; btn.innerText = num;
                    if([5,12,20,44].includes(num)) btn.className += ' taken';
                    leftBoard.appendChild(btn);
                }
            }
