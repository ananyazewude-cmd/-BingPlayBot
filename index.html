<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beteseb Bingo Official Screen</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0d0e1b; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .page { display: none; width: 100%; max-width: 450px; flex-direction: column; }
        .active { display: flex; }
        
        /* የጋራ መቆጣጠሪያ ንድፍ */
        button { cursor: pointer; border: none; font-weight: bold; }
        
        /* 1. የ96 ሎቢ ገጽ ንድፍ (Lobby 96 View) */
        .lobby-top { display: flex; justify-content: space-between; background-color: #1a1b2e; padding: 10px; border-radius: 6px; font-size: 11px; margin-bottom: 12px; border: 1px solid #292a42; }
        .lobby-timer { background-color: #ffcc00; color: #0d0e1b; padding: 4px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .grid-96 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background-color: #151627; padding: 10px; border-radius: 8px; border: 1px solid #23243a; }
        .g96-cell { background-color: #242542; color: #c3c5db; font-size: 12px; padding: 11px 0; border-radius: 5px; font-weight: bold; text-align: center; }
        .g96-cell.taken { background-color: #ff5500; color: white; }
        .g96-cell.mine { background-color: #00b894; color: white; }

        /* 2. ዋናው የጨዋታ ገጽ ንድፍ (Main Game View) */
        .game-header { display: flex; justify-content: space-between; background-color: #211545; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-align: center; margin-bottom: 10px; border: 1px solid #36256b; }
        .gh-box { display: flex; flex-direction: column; }
        .gh-val { color: #ffbe00; font-size: 13px; margin-top: 2px; }
        
        .recent-balls { display: flex; gap: 4px; margin-bottom: 10px; width: 100%; justify-content: flex-start; overflow-x: auto; }
        .ball-tag { padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; }
        .ball-tag.b { background-color: #00a8ff; }
        .ball-tag.i { background-color: #9b59b6; }
        .ball-tag.n { background-color: #e67e22; }
        .ball-tag.g { background-color: #2ecc71; }
        .ball-tag.o { background-color: #e74c3c; }

        .split-board { display: flex; gap: 8px; width: 100%; }
        .board-left { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background-color: #1a1b2f; padding: 6px; border-radius: 8px; width: 45%; border: 1px solid #2b2c4a; }
        .board-right { display: flex; flex-direction: column; width: 55%; gap: 8px; background-color: #161729; padding: 8px; border-radius: 8px; align-items: center; border: 1px solid #25263d; }
        
        /* የግራ ቦርድ ፊደላትና ቁጥሮች */
        .bl-head { color: white; font-weight: bold; font-size: 13px; padding: 4px 0; border-radius: 3px; text-align: center; }
        .bl-num { background-color: #292a47; color: #9aa0c2; font-size: 11px; font-weight: bold; padding: 6px 0; border-radius: 3px; text-align: center; }
        .bl-num.hit { background-color: #ff5500; color: white; }

        /* የቀኝ ቦርድ ኳስና ካርታ */
        .big-ball { background-color: #ffcc00; color: #0d0e1b; font-size: 26px; font-weight: bold; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .auto-line { display: flex; justify-content: space-between; width: 90%; font-size: 12px; margin: 4px 0; }
        .bingo-row { display: flex; gap: 3px; width: 100%; justify-content: center; }
        .br-let { font-size: 13px; font-weight: bold; padding: 4px 9px; border-radius: 3px; color: white; }
        
        .cartela-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; }
        .c-cell { background-color: white; color: #0d0e1b; font-size: 14px; font-weight: bold; padding: 8px 0; border-radius: 4px; text-align: center; }
        .c-cell.matched { background-color: #2ecc71 !important; color: white; }
        .c-cell.star { background-color: #2ecc71 !important; color: #ffcc00; font-size: 16px; }

        /* የታችኛው አሞሌ */
        .nav-tabs { display: flex; width: 100%; max-width: 450px; background-color: #1a1b2e; padding: 8px 0; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); border-top: 1px solid #2a2b44; }
        .tab-btn { flex: 1; background: none; color: #7f8c8d; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-btn.active-tab { color: #00a8ff; }
        .action-bar { display: flex; gap: 8px; width: 100%; margin-top: 12px; padding-bottom: 60px; }
        .btn-act { flex: 1; padding: 12px 0; font-size: 14px; font-weight: bold; border-radius: 6px; color: white; }
    </style>
</head>
<body>

    <!-- ገጽ 1፡ የ96 ቁጥር ሎቢ ገጽ (የመጀመሪያው ምስልህ) -->
    <div class="page active" id="viewLobby">
        <div class="lobby-top">
            <div>Main Wallet<br><strong style="color:#00b894; font-size:13px;">0</strong></div>
            <div>Play Wallet<br><strong font-size:13px;">0</strong></div>
            <div>Stake<br><strong style="font-size:13px;">10</strong></div>
            <div class="lobby-timer">46 s</div>
        </div>
        <div class="grid-96" id="lobbyGrid"></div>
        <div class="action-bar">
            <button class="btn-act" style="background-color:#e74c3c;" onclick="tg.close()">🎰 Back</button>
            <button class="btn-act" style="background-color:#2ecc71;" onclick="startMainGame()">🎮 Play Game</button>
        </div>
    </div>

    <!-- ገጽ 2፡ ዋናው የጨዋታ ገጽ (የሁለተኛው ምስልህ) -->
    <div class="page" id="viewGame">
        <div class="game-header">
            <div class="gh-box"><div>Game ID</div><div class="gh-val">BBXV62CP</div></div>
            <div class="gh-box"><div>Players</div><div class="gh-val">335</div></div>
            <div class="gh-box"><div>Bet</div><div class="gh-val">10</div></div>
            <div class="gh-box"><div>Derash</div><div class="gh-val">2680</div></div>
            <div class="gh-box"><div>Called</div><div class="gh-val" id="calledTxt">14</div></div>
        </div>
        <div class="recent-balls" id="recentContainer">
            <div class="ball-tag b">I-28</div><div class="ball-tag g">G-60</div><div class="ball-tag n">N-32</div><div class="ball-tag b" style="background-color:#ffcc00; color:#111;">I-29</div>
        </div>
        <div class="split-board">
            <div class="board-left" id="gameLeftGrid"></div>
            <div class="board-right">
                <div class="big-ball" id="currentBall">I-29</div>
                <div class="auto-line"><span>Automatic</span><span style="color:#2ecc71; font-weight:bold;">● ON</span></div>
                <div class="bingo-row">
                    <div class="br-let" style="background-color:#00a8ff;">B</div><div class="br-let" style="background-color:#9b59b6;">I</div><div class="br-let" style="background-color:#e67e22;">N</div><div class="br-let" style="background-color:#2ecc71;">G</div><div class="br-let" style="background-color:#e74c3c;">O</div>
                </div>
                <div class="cartela-matrix" id="cartelaGrid"></div>
                <div style="font-size:10px; color:#ffbe00; margin-top:4px; font-weight:bold;">Cartela No: 131</div>
            </div>
        </div>
        <div class="action-bar">
            <button class="btn-act" style="background-color:#ff4757;" onclick="location.reload()">Leave</button>
            <button class="btn-act" style="background-color:#e67e22;" onclick="triggerDrawEngine()">Automatic</button>
        </div>
    </div>

    <!-- የታችኛው የመርጫ አሞሌ (Navigation Tabs) -->
    <div class="nav-tabs">
        <div class="tab-btn active-tab"><span>🎮</span><br>Game</div>
        <div class="tab-btn" onclick="tg.showAlert('የጨዋታ ታሪክ ገና አልተመዘገበም')"><span>🕒</span><br>History</div>
        <div class="tab-btn" onclick="tg.showAlert('ዋሌት በቅርቡ ይከፈታል')"><span>💳</span><br>Wallet</div>
        <div class="tab-btn" onclick="tg.showAlert('አናንያ አደፍርስ')"><span>👤</span><br>Profile</div>
    </div>

    <script>
        // 1. የሎቢ 96 ቁጥሮችን በዘፈቀደ የተያዙ አድርጎ መሙላት (የመጀመሪያው ምስልህ)
        const lobbyGrid = document.getElementById('lobbyGrid');
        const taken96 =;
        for(let i=1; i<=96; i++) {
            const cell = document.createElement('div');
            cell.className = 'g96-cell'; cell.innerText = i;
            if(taken96.includes(i)) cell.classList.add('taken');
            if(i === 29) cell.classList.add('mine'); // ያንተ ቁጥር
            lobbyGrid.appendChild(cell);
        }

        function startMainGame() {
            document.getElementById('viewLobby').style.removeProperty('display');
            document.getElementById('viewLobby').style.display = 'none';
            document.getElementById('viewGame').classList.add('active');
            initGameComponents();
        }

        // 2. ዋናውን የቢንጎ ሰሌዳ መሙላት (የሁለተኛው ምስልህ)
        function initGameComponents() {
            const leftGrid = document.getElementById('gameLeftGrid');
            leftGrid.innerHTML = '';
            const prefixes = ['B','I','N','G','O'];
            const prefixColors = ['#00a8ff','#9b59b6','#e67e22','#2ecc71','#e74c3c'];
            const hitNumbers =;

            // የጭንቅላት ፊደላትን መደርደር
            for(let i=0; i<5; i++) {
                const head = document.createElement('div');
                head.className = 'bl-head'; head.innerText = prefixes[i];
                head.style.backgroundColor = prefixColors[i];
